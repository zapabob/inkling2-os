
# Private USB rules. The local console does not use the Tor SOCKS or control port.
insert rule inet inkling2_filter output oifname "lo" tcp dport { 9150, 9151 } reject with tcp reset
insert rule inet inkling2_filter output oifname "lo" tcp dport { 9150, 9151 } meta skuid { 0, 61003 } accept
add rule inet inkling2_filter output meta skuid 61003 meta nfproto ipv4 meta l4proto tcp accept
add rule inet inkling2_filter output meta skuid 61003 ip6 daddr 2000::/3 meta l4proto tcp accept
