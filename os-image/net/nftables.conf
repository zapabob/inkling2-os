#!/usr/sbin/nft -f
# PID 1 installs this policy before enabling external interfaces.
flush ruleset

table inet inkling2_filter {
    set non_public_v4 {
        type ipv4_addr; flags interval;
        elements = { 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8,
                     169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24,
                     192.88.99.0/24, 192.168.0.0/16, 198.18.0.0/15,
                     198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/3 }
    }

    chain input {
        type filter hook input priority 0; policy drop;
        iifname "lo" accept
        ct state invalid drop
        ct state established,related accept
        udp sport 67 udp dport 68 accept
        meta l4proto 58 icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy drop;

        oifname "lo" tcp dport 8080 meta skuid { 0, 61001 } accept
        oifname "lo" tcp dport 29483 meta skuid { 0, 61000 } accept
        oifname "lo" tcp dport { 8080, 29483 } reject with tcp reset
        oifname "lo" accept
        ct state invalid drop

        # Bootstrap traffic and a fixed resolver set.
        meta skuid 0 udp sport 68 udp dport 67 accept
        meta skuid 0 meta nfproto ipv4 udp dport 123 accept
        meta skuid { 0, 61000, 61002 } ip daddr { 1.1.1.1, 9.9.9.9 } udp dport 53 accept
        meta skuid { 0, 61000, 61002 } ip daddr { 1.1.1.1, 9.9.9.9 } tcp dport 53 accept
        meta l4proto 58 icmpv6 type { nd-router-solicit, nd-neighbor-solicit, nd-neighbor-advert } accept

        ip daddr @non_public_v4 drop
        meta skuid { 61000, 61002 } meta nfproto ipv4 tcp dport 443 accept
    }
}
