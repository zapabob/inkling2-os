#!/usr/sbin/nft -f
# Inkling2-OS Default-Deny Inbound Stateful Firewall (SOP-Security / SOP-Internet-Connectivity)
# Loaded by PID 1 BEFORE any external NIC is brought UP.

flush ruleset

table inet inkling2_filter {
    chain input {
        type filter hook input priority 0; policy drop;

        # Allow loopback IPC (inkling2-shell <-> inkling2-engine)
        iifname "lo" accept

        # Allow VM-initiated SSH ONLY over encrypted Tailscale mesh (public/LAN stays default-deny!)
        iifname "tailscale0" tcp dport 22 accept

        # Allow replies to our own outbound connections
        ct state established,related accept

        # Drop invalid packets
        ct state invalid drop

        # Allow ICMPv6 neighbor discovery / DHCPv6 essentials
        ip6 nexthdr icmpv6 icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
