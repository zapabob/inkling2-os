set default=0
set timeout=8

serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial

menuentry "Inkling2-OS v1.1.0" {
    linux /boot/vmlinuz boot=casper live-media-path=/casper init=/sbin/inkling2-init nopersistent noeject noswap noresume console=tty1 console=ttyS0,115200n8
    initrd /boot/initramfs.img
}

menuentry "Inkling2-OS v1.1.0 boot validation (automatic power-off)" {
    linux /boot/vmlinuz boot=casper live-media-path=/casper init=/sbin/inkling2-init nopersistent noeject noswap noresume inkling2.smoke=1 console=tty1 console=ttyS0,115200n8
    initrd /boot/initramfs.img
}
