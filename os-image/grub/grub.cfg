set default=0
set timeout=3

menuentry "Inkling2-OS v0.1.0 (CUDA 13.5 sm_120a WDDM-Free AI-Native Appliance)" {
    linux /boot/vmlinuz init=/sbin/inkling2-init isolcpus=2-11 nohz_full=2-11 rcu_nocbs=2-11 default_hugepagesz=2M hugepagesz=2M hugepages=8192 transparent_hugepage=never nvidia-drm.modeset=0 nvme_core.io_timeout=30 amd_pstate=active console=tty1 quiet
    initrd /boot/initramfs.img
}

menuentry "Inkling2-OS v0.1.0 (Recovery / Verbose Boot)" {
    linux /boot/vmlinuz init=/sbin/inkling2-init nvidia-drm.modeset=0 console=tty1
    initrd /boot/initramfs.img
}
