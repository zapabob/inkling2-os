[package]
name = "inkling2-shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
inkling2-companion = { path = "../inkling2-companion" }
inkling2-resource = { path = "../inkling2-resource" }
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
serde_json = "1.0.154"
ammonia = "4.2.5"
url = "2.5.8"
minijinja = { version = "2.12.0", features = ["fuel", "json"] }
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
zstd = { version = "0.14.3", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"
unwrap_used = "deny"
expect_used = "deny"
