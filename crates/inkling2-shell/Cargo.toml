[package]
name = "inkling2-shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
inkling2-companion = { path = "../inkling2-companion" }
inkling2-resource = { path = "../inkling2-resource" }
cap-std = "4.0.3"
