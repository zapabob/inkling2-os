name: Stage Inkling2-OS release candidates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-candidate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - run: rustup override set 1.94.1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --workspace --release
      - shell: pwsh
        run: ./scripts/package-windows-console.ps1 -OutDir ./release-dist
      - uses: actions/upload-artifact@v4
        with:
          name: inkling2-os-windows-candidate
          path: release-dist/
          if-no-files-found: error

  iso-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify the diagnostic ISO
        run: |
          docker build -f os-image/Dockerfile.iso-builder --target verification -t inkling2-iso-candidate .
          docker run --rm --network none inkling2-iso-candidate
          candidate=$(docker create inkling2-iso-candidate)
          trap 'docker rm "$candidate" >/dev/null' EXIT
          mkdir release-dist
          docker cp "$candidate:/out/." release-dist/
          (cd release-dist && sha256sum ./*.iso > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: inkling2-os-linux-iso-candidate
          path: release-dist/
          if-no-files-found: error
